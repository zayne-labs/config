minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
   - "@zayne-labs/*"

strictDepBuilds: false

packages:
   - packages/*

allowBuilds:
   esbuild: set this to true or false
   unrs-resolver: set this to true or false

catalogs:
   eslint:peer:
      "@eslint-react/eslint-plugin": ^5.19.0
      "@next/eslint-plugin-next": ^16.3.4
      "@tanstack/eslint-plugin-query": ^5.102.8
      "@tanstack/eslint-plugin-router": ^1.162.0
      astro-eslint-parser: ^3.1.0
      eslint: ^10.10.0
      eslint-config-expo: ^57.0.2
      eslint-plugin-astro: ^3.1.0
      eslint-plugin-better-tailwindcss: ^4.7.0
      eslint-plugin-depend: ^1.5.0
      eslint-plugin-erasable-syntax-only: ^0.7.1
      eslint-plugin-jsx-a11y: ^6.10.2
      eslint-plugin-react-hooks: ^7.1.1
      eslint-plugin-react-refresh: ^0.5.6
      eslint-plugin-react-you-might-not-need-an-effect: ^1.0.2
      eslint-plugin-solid: ^0.17.0
      eslint-plugin-svelte: ^3.23.0
      eslint-plugin-vue: ^10.11.0
      eslint-plugin-vuejs-accessibility: ^2.6.0
      eslint-processor-vue-blocks: ^2.0.0
      svelte-eslint-parser: ^1.8.1
      vue-eslint-parser: ^10.4.1

   prettier:peer:
      "@ianvs/prettier-plugin-sort-imports": ^4.7.1
      prettier: ^3.9.6
      prettier-plugin-astro: ^0.14.1
