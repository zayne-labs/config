minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
   - "@zayne-labs/*"
   - knip@6.45.0

strictDepBuilds: false

packages:
   - packages/*

allowBuilds:
   esbuild: set this to true or false
   unrs-resolver: set this to true or false

catalogs:
   eslint:peer:
      "@eslint-react/eslint-plugin": ^5.28.8
      "@next/eslint-plugin-next": ^16.4.6
      "@tanstack/eslint-plugin-query": ^5.107.1
      "@tanstack/eslint-plugin-router": ^1.162.0
      astro-eslint-parser: ^3.2.0
      eslint: ^10.14.0
      eslint-config-expo: ^58.0.4
      eslint-plugin-astro: ^3.2.1
      eslint-plugin-better-tailwindcss: ^4.11.0
      eslint-plugin-depend: ^1.5.0
      eslint-plugin-erasable-syntax-only: ^0.7.2
      eslint-plugin-jsx-a11y: ^6.10.2
      eslint-plugin-react-hooks: ^7.1.1
      eslint-plugin-react-refresh: ^0.5.7
      eslint-plugin-react-you-might-not-need-an-effect: ^1.2.0
      eslint-plugin-solid: ^0.19.0
      eslint-plugin-svelte: ^3.24.1
      eslint-plugin-vue: ^10.12.1
      eslint-plugin-vuejs-accessibility: ^2.6.3
      eslint-processor-vue-blocks: ^2.0.0
      svelte-eslint-parser: ^1.10.1
      vue-eslint-parser: ^10.4.2

   knip:peer:
      knip: ^6.45.0

   prettier:peer:
      "@ianvs/prettier-plugin-sort-imports": ^4.7.1
      prettier: ^3.9.10
      prettier-plugin-astro: ^1.1.2
      prettier-plugin-classnames: ^0.10.5
      prettier-plugin-merge: ^0.10.2
      prettier-plugin-tailwindcss: ^0.8.1
